<!DOCTYPE html>
<html>
<head>
    <title>Change Color Theme</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            text-align: center;
            padding-top: 50px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }
        .content {
            width: 400px;
            margin: 30px auto;
            padding: 20px;
            border: 2px solid gray;
        }
    </style>
</head>
<body id="mybody">

    <h1>Color Theme Changer</h1>
    <p>Click on any button to change the theme</p>

    <button onclick="changeTheme('white', 'black')">Light</button>
    <button onclick="changeTheme('black', 'white')">Dark</button>
    <button onclick="changeTheme('lightblue', 'darkblue')">Blue</button>
    <button onclick="changeTheme('lightgreen', 'darkgreen')">Green</button>
    <button onclick="changeTheme('pink', 'purple')">Pink</button>

    <div class="content">
        <h3>Sample Content</h3>
        <p>This is some text. When you change the theme, the background color and the text color of this page will change.</p>
    </div>

    <script>
        function changeTheme(bgColor, textColor) {
            let body = document.getElementById("mybody");
            body.style.backgroundColor = bgColor;
            body.style.color = textColor;
        }
    </script>

</body>
</html>
