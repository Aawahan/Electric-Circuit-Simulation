<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>
    <style>
        body {
            background-color: black;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        #clock {
            color: lime;
            font-size: 70px;
            margin-top: 150px;
        }
        #date {
            color: white;
            font-size: 22px;
        }
    </style>
</head>
<body>

    <div id="clock"></div>
    <div id="date"></div>

    <script>
        function showTime() {
            let now = new Date();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let ampm = "AM";

            if (hours >= 12) {
                ampm = "PM";
            }
            if (hours > 12) {
                hours = hours - 12;
            }
            if (hours == 0) {
                hours = 12;
            }

            if (hours < 10) {
                hours = "0" + hours;
            }
            if (minutes < 10) {
                minutes = "0" + minutes;
            }
            if (seconds < 10) {
                seconds = "0" + seconds;
            }

            document.getElementById("clock").innerHTML = hours + ":" + minutes + ":" + seconds + " " + ampm;
            document.getElementById("date").innerHTML = now.toDateString();
        }

        showTime();

        setInterval(showTime, 1000);
    </script>

</body>
</html>
