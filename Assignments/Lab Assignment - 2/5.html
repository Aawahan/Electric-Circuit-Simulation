<html>
	<head>
		<title>Login Page</title>
	</head>
	<body>
		<h1 align="center">Login Page</h1>
		
		<form>
			<table border="1px" align="center" cellspacing="0px" cellpadding="10px">
				<td>
					<strong>Email:</strong>
					<br>
					<label for="email">
						<input type="email" id="email" placeholder="hello@gmail.com"/> 
					</label>
					<br><br>

					<strong>Password:</strong>
					<br>
					<label for="password">
						<input type="password" id="password"/> 
					</label>
					<br>
					<label style="font-size:10px">Forgot Password?</label>
					<br><br>
					
					<a href="" width="100px">New User</a>
					<button>Login</button>
					<br>
				</td>
			</table>
		</form>
		
	</body>
</html>
